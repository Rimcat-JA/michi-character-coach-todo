name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Check all Electron CJS syntax
        run: npm run check:electron
      - run: npm run lint
      - run: npm test
      - name: Test Electron notification and local bridges
        run: npm run test:electron
      - run: npm run build
      - name: Check device data in hidden Chromium (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check:device-data
      - name: Check device data in hidden Chromium (Windows)
        if: runner.os == 'Windows'
        run: npm run check:device-data
